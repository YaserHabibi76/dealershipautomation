services:
  - type: web
    name: dealer-contact-bot
    env: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    envVars:
      - key: APP_PASSWORD
        sync: false
      - key: CAPSOLVER_API_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data
    # Upgraded from free to starter (0.5 CPU / 512MB) to fix Playwright timing
    # failures (form-field detection, individual field fills) that reproduced
    # reliably locally but failed intermittently on Render — consistent with
    # the free plan's 0.1 CPU being too little for a real Chromium browser
    # under load. No persistent disk added — /data is still an ordinary
    # ephemeral directory that resets on every redeploy (CAPSOLVER_API_KEY is
    # an env var instead, so it isn't affected; contact info / dealer CSVs
    # still need re-entering each session). See DEPLOY.md for details.
