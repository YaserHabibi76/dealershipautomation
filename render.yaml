services:
  - type: web
    name: dealer-contact-bot
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: APP_PASSWORD
        sync: false
      - key: CAPSOLVER_API_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data
    # No persistent disk on the free plan — /data is just an ordinary ephemeral
    # directory inside the container. It works fine while the instance is up, but
    # resets on every redeploy and after ~15 min idle (free services spin down and
    # lose their filesystem). See DEPLOY.md for what that means day to day.
